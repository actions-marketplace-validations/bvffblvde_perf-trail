name: perf-trail
description: Measure every deploy with Lighthouse and keep the history in a git branch
author: bvffblvde
branding:
  icon: activity
  color: green
inputs:
  urls:
    description: Newline separated URLs to audit, all on one origin
    required: true
  runs:
    description: Lighthouse runs per URL, the median run is stored
    default: "3"
  preset:
    description: mobile or desktop
    default: mobile
  data-branch:
    description: Branch that stores history.json
    default: perf-data
  max-entries:
    description: How many entries the history keeps
    default: "300"
  environment-prefix:
    description: deployment_status events are measured only when the environment starts with this
    default: Production
  use-deployment-url:
    description: Audit the deployment URL from the event instead of urls (it may be behind deployment protection)
    default: "false"
  store-commit-message:
    description: Store the first line of the commit message
    default: "true"
  revalidate-url:
    description: URL to POST after the history is saved
    required: false
  revalidate-secret:
    description: Sent as a bearer token to revalidate-url
    required: false
  bundle:
    description: Measure gzip JS per route with next, vite or glob:<pattern>, or off
    default: "off"
  build-command:
    description: Shell command run in working-directory before the bundle is measured
    required: false
  working-directory:
    description: Directory with the app build, relative to the repository root
    default: "."
  budgets:
    description: Path to perf-trail.budgets.json, relative to the repository root
    required: false
  fail-on-budget:
    description: Fail the job when a budget is broken (the entry is saved first)
    default: "true"
  github-token:
    description: Token with contents write access
    default: ${{ github.token }}
outputs:
  skipped:
    description: true when the event was not measured
  entry-json:
    description: The saved history entry as JSON
  budget-passed:
    description: false when a budget was broken
  summary-markdown:
    description: The job summary as Markdown
runs:
  using: node24
  main: packages/action/dist/index.js
