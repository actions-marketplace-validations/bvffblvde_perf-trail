name: Perf

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perf-trail
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: |
          npm install --global corepack@latest
          corepack enable
          pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - uses: ./
        with:
          urls: |
            ${{ vars.EXAMPLE_SITE_URL }}/
            ${{ vars.EXAMPLE_SITE_URL }}/docs
          working-directory: examples/next-app
          build-command: pnpm build
          bundle: next
          budgets: examples/next-app/perf-trail.budgets.json
          revalidate-url: ${{ vars.EXAMPLE_SITE_URL }}/api/revalidate
          revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}
