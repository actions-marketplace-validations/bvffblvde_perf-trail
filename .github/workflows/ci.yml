name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: |
          npm install --global corepack@latest
          corepack enable
          pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Generated files are up to date
        run: |
          pnpm --filter @perf-trail/core schema
          git diff --exit-code -- packages/action/dist packages/core/schema || {
            echo "::error::Run pnpm build and pnpm --filter @perf-trail/core schema, then commit the result"
            exit 1
          }
